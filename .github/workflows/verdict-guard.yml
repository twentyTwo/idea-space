name: Verdict guard

# CLAUDE.md: "An issue closed without a verdict label and a stated reason is a lost
# idea." Every other stage of the pipeline is enforced in research.yml; the close was
# the one transition with nothing reading it back. This watches that transition.
#
# It is a detector, not a gate. Labels stay hand-editable — this only notices when the
# three parts of a close (verdict label, reason comment, closed state) did not all
# happen together.

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  guard:
    # Only idea issues. Every other closed issue in the repo falls through here.
    if: contains(github.event.issue.labels.*.name, 'ms:idea')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # Two failures, two different responses. A missing or doubled verdict label is an
      # unambiguous breach of the rule, so this reopens — which is self-correcting, since
      # closing it again properly leaves nothing to complain about. A missing reason is
      # only inferred (see below), so that path comments and never reopens: reopening on
      # a guess would train you to ignore the guard.
      - name: Check the verdict
        run: |
          set -uo pipefail
          issue=$(gh issue view "$ISSUE" --json labels,comments) || exit 1
          labels=$(jq -r '.labels[].name' <<<"$issue")
          verdicts=$(grep -cE '^ms:(approved|killed)$' <<<"$labels")

          if [ "$verdicts" -eq 0 ]; then
            gh issue comment "$ISSUE" --body "$(cat <<'EOF'
          <!-- ideaspace:verdict-guard -->
          **Reopened — no verdict label.**

          This idea was closed carrying neither `ms:approved` nor `ms:killed`, so there is
          no record of what was decided. Close it again with exactly one of them, plus a
          comment giving the reason in one sentence.

          The reason is the entire point of keeping killed ideas around: it is what stops
          the same idea being researched twice.
          EOF
          )" || exit 1
            gh issue reopen "$ISSUE" || exit 1
            exit 0
          fi

          if [ "$verdicts" -gt 1 ]; then
            gh issue comment "$ISSUE" --body "$(cat <<'EOF'
          <!-- ideaspace:verdict-guard -->
          **Reopened — two verdict labels.**

          This idea is carrying both `ms:approved` and `ms:killed`. Remove whichever is
          wrong, then close it again.
          EOF
          )" || exit 1
            gh issue reopen "$ISSUE" || exit 1
            exit 0
          fi

          # The reason check, and it is a heuristic: there is no marker for "this comment
          # is the reason". Every automated comment here — findings, critique, failure
          # notice — is posted by the Actions bot, so a human comment landing after them is
          # the reason. If the newest comment is still the bot's, nobody wrote one.
          author=$(jq -r '(.comments | last | .author.login) // ""' <<<"$issue")
          case "$author" in
            github-actions|github-actions\[bot\]|"")
              gh issue comment "$ISSUE" --body "$(cat <<'EOF'
          <!-- ideaspace:verdict-guard -->
          **Verdict recorded, but no reason comment.**

          The newest comment on this issue is automated, so this close looks like it went
          in without a stated reason. The label says what you decided; it does not say why.

          Add a one-sentence reason and this is settled — no need to reopen. If the reason
          is recorded somewhere else, ignore this.
          EOF
          )" || exit 1
              ;;
          esac
